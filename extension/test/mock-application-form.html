<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Apply for Senior Data Analyst at GlobalTech</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #1e293b; margin: 0; padding: 40px 20px; }
    .container { max-width: 680px; margin: 0 auto; background: white; border-radius: 12px; padding: 32px; border: 1px solid #e2e8f0; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    h1 { font-size: 24px; margin-top: 0; }
    .subtitle { color: #64748b; font-size: 14px; margin-bottom: 24px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #334155; }
    input[type="text"], input[type="email"], input[type="tel"], input[type="url"], input[type="number"], select, textarea {
      width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; box-sizing: border-box;
    }
    .row { display: flex; gap: 16px; }
    .row .form-group { flex: 1; }
    .radio-group { display: flex; gap: 16px; align-items: center; margin-top: 4px; }
    .radio-label { display: flex; align-items: center; gap: 6px; font-weight: normal; cursor: pointer; }
    .submit-btn { width: 100%; padding: 12px; background: #4f46e5; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>GlobalTech Application Form</h1>
    <p class="subtitle">Position: Senior Data Analyst · Location: Remote</p>

    <form id="application_form" action="/submit-application" method="POST">
      <!-- Personal Info -->
      <div class="row">
        <div class="form-group">
          <label for="first_name">First Name *</label>
          <input type="text" id="first_name" name="first_name" placeholder="Given name" required autocomplete="given-name" />
        </div>
        <div class="form-group">
          <label for="last_name">Last Name *</label>
          <input type="text" id="last_name" name="last_name" placeholder="Family name" required autocomplete="family-name" />
        </div>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="email">Email Address *</label>
          <input type="email" id="email" name="candidate_email" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="phone">Phone Number *</label>
          <input type="tel" id="phone" name="phone_number" placeholder="+1 (555) 000-0000" required autocomplete="tel" />
        </div>
      </div>

      <!-- Professional Links -->
      <div class="form-group">
        <label for="linkedin_url">LinkedIn Profile</label>
        <input type="url" id="linkedin_url" name="linkedin_profile" placeholder="https://linkedin.com/in/username" />
      </div>

      <div class="form-group">
        <label for="portfolio_url">Portfolio or Personal Website</label>
        <input type="url" id="portfolio_url" name="portfolio_url" placeholder="https://yourportfolio.com" />
      </div>

      <!-- Education -->
      <div class="row">
        <div class="form-group">
          <label for="university">University / College</label>
          <input type="text" id="university" name="institution" placeholder="e.g. Stanford University" />
        </div>
        <div class="form-group">
          <label for="degree">Degree Earned</label>
          <input type="text" id="degree" name="degree" placeholder="e.g. Bachelor of Science" />
        </div>
      </div>

      <!-- Application Details -->
      <div class="row">
        <div class="form-group">
          <label for="salary">Expected Salary (USD)</label>
          <input type="text" id="salary" name="desired_salary" placeholder="e.g. $120,000" />
        </div>
        <div class="form-group">
          <label for="notice">Notice Period</label>
          <input type="text" id="notice" name="notice_period" placeholder="e.g. 2 weeks" />
        </div>
      </div>

      <!-- Work Authorization Radio Group -->
      <div class="form-group">
        <label>Are you legally authorized to work in this country? *</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="work_authorization" value="yes" /> Yes
          </label>
          <label class="radio-label">
            <input type="radio" name="work_authorization" value="no" /> No
          </label>
        </div>
      </div>

      <!-- Visa Sponsorship Select Dropdown -->
      <div class="form-group">
        <label for="sponsorship">Will you now or in the future require visa sponsorship? *</label>
        <select id="sponsorship" name="visa_sponsorship">
          <option value="">-- Please Select --</option>
          <option value="no">No, I do not require sponsorship</option>
          <option value="yes">Yes, I require sponsorship</option>
        </select>
      </div>

      <!-- Resume Upload -->
      <div class="form-group">
        <label for="resume_file">Upload Resume / CV *</label>
        <input type="file" id="resume_file" name="resume" accept=".pdf,.doc,.docx" />
      </div>

      <!-- Custom Open-Ended Question -->
      <div class="form-group">
        <label for="custom_why">Why are you interested in joining GlobalTech? *</label>
        <textarea id="custom_why" name="custom_question_why" rows="4" placeholder="Describe your motivations and relevant background..."></textarea>
      </div>

      <!-- Manual Submit Button -->
      <button type="submit" class="submit-btn" id="submit_app_btn">Submit Application</button>
    </form>
  </div>
</body>
</html>
