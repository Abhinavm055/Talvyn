<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talvyn</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root, body.theme-dark {
      --bg-main: #06070D;
      --bg-card: #0C0D1A;
      --bg-card-subtle: rgba(255, 255, 255, 0.03);
      --bg-card-hover: #131526;
      --bg-input: #101222;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-focus: #5054EA;
      --text-primary: #F3F4F8;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --accent: #5054EA;
      --accent-hover: #4347D4;
      --accent-glow: rgba(80, 84, 234, 0.4);
      --badge-connected-bg: rgba(16, 185, 129, 0.12);
      --badge-connected-text: #34D399;
      --badge-connected-dot: #10B981;
      --badge-offline-bg: rgba(245, 158, 11, 0.12);
      --badge-offline-text: #FBBF24;
      --badge-offline-dot: #F59E0B;
      --glow-top: radial-gradient(ellipse at 50% 0%, rgba(80, 84, 234, 0.2), transparent 70%);
      --glow-bottom: radial-gradient(ellipse at 50% 100%, rgba(124, 58, 237, 0.12), transparent 70%);
      --toggle-track-bg: #14162B;
      --toggle-track-border: rgba(255, 255, 255, 0.14);
    }

    body.theme-light {
      --bg-main: #F8FAFC;
      --bg-card: #FFFFFF;
      --bg-card-subtle: #F1F5F9;
      --bg-card-hover: #E2E8F0;
      --bg-input: #FFFFFF;
      --border-color: #E2E8F0;
      --border-focus: #5054EA;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #94A3B8;
      --accent: #5054EA;
      --accent-hover: #4347D4;
      --accent-glow: rgba(80, 84, 234, 0.25);
      --badge-connected-bg: #ECFDF5;
      --badge-connected-text: #059669;
      --badge-connected-dot: #10B981;
      --badge-offline-bg: #FEF3C7;
      --badge-offline-text: #B45309;
      --badge-offline-dot: #F59E0B;
      --glow-top: radial-gradient(ellipse at 50% 0%, rgba(99, 102, 241, 0.08), transparent 70%);
      --glow-bottom: radial-gradient(ellipse at 50% 100%, rgba(168, 85, 247, 0.05), transparent 70%);
      --toggle-track-bg: #E2E8F0;
      --toggle-track-border: #CBD5E1;
    }

    body {
      width: 360px;
      min-height: 480px;
      max-height: 590px;
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      background-color: var(--bg-main);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      overflow-y: auto;
      transition: background-color 0.25s ease, color 0.25s ease;
      position: relative;
    }

    .popup-mode-btn {
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
      box-sizing: border-box;
      user-select: none;
    }
    .popup-mode-btn.active {
      background: #5054EA;
      color: #FFFFFF;
      border: 1px solid #5054EA;
      box-shadow: 0 2px 10px rgba(80, 84, 234, 0.35);
    }
    .popup-mode-btn.inactive {
      background: var(--bg-card-subtle);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      box-shadow: none;
    }
    .popup-mode-btn.inactive:hover {
      background: var(--bg-card-hover);
      border-color: rgba(255, 255, 255, 0.16);
    }
    body.theme-light .popup-mode-btn.inactive:hover {
      border-color: #CBD5E1;
    }

    /* Form controls in manual save mode */
    .manual-input, .manual-select, .manual-textarea {
      width: 100%;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 11.5px;
      color: var(--text-primary);
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 7px;
      padding: 6px 9px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .manual-input:focus, .manual-select:focus, .manual-textarea:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 2px rgba(80, 84, 234, 0.18);
    }
    .manual-label {
      display: block;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 3px;
    }

    #app {
      padding: 0;
      width: 100%;
      min-height: 100%;
      position: relative;
      z-index: 1;
    }

    /* Ambient Cosmic Background Glows */
    .ambient-glow-top {
      position: fixed;
      top: -40px;
      left: 0;
      right: 0;
      height: 180px;
      background: var(--glow-top);
      pointer-events: none;
      z-index: 0;
      transition: background 0.3s ease;
    }

    .ambient-glow-bottom {
      position: fixed;
      bottom: -40px;
      left: 0;
      right: 0;
      height: 140px;
      background: var(--glow-bottom);
      pointer-events: none;
      z-index: 0;
      transition: background 0.3s ease;
    }

    /* ─── Single Round Theme Toggle (Sun/Moon, No Sliding Animation) ─── */
    .round-theme-toggle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: all 0.2s ease;
      outline: none;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .round-theme-toggle:hover {
      border-color: var(--accent);
      color: var(--text-primary);
      transform: scale(1.05);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .round-theme-toggle:active {
      transform: scale(0.95);
    }

    .round-theme-toggle svg {
      transition: transform 0.25s ease, color 0.25s ease;
    }

    body.theme-light .round-theme-toggle {
      background: #FFFFFF;
      border-color: #E2E8F0;
      color: #F59E0B;
    }

    body.theme-dark .round-theme-toggle {
      background: #14172B;
      border-color: rgba(255, 255, 255, 0.12);
      color: #818CF8;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.25);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.45);
    }
  </style>
</head>
<body class="theme-dark">
  <div class="ambient-glow-top"></div>
  <div class="ambient-glow-bottom"></div>
  <div id="app">
    <div id="loading" style="display:flex;align-items:center;justify-content:center;height:240px;color:#94a3b8;font-size:13px;">
      Loading…
    </div>
  </div>
  <script type="module" src="popup.ts"></script>
</body>
</html>
