name: Extension validation and approved GitHub release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

# Ordinary pushes and pull requests cannot create releases or modify repository contents.
permissions:
  contents: read

concurrency:
  group: extension-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: talvyn_test
          POSTGRES_PASSWORD: local-ci-test-only
          POSTGRES_DB: talvyn_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U talvyn_test -d talvyn_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://talvyn_test:local-ci-test-only@127.0.0.1:5432/talvyn_test
      TALVYN_TEST_DATABASE_URL: postgresql://talvyn_test:local-ci-test-only@127.0.0.1:5432/talvyn_test
      TALVYN_EXTENSION_PUBLIC_KEY: ${{ vars.TALVYN_EXTENSION_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - name: Migrate only the disposable CI database
        run: npm run db:deploy
      - name: Build and package extension before tests
        run: npm run package:extension
      - run: npm test
      - run: npm run test:integration
      - name: Real saved-search HTTP and database checks
        run: npx --no-install tsx test/verify-saved-searches.ts
      - run: npm run build
      - run: npm run verify:extension-package
      - name: Check version tags against the actual packaged version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          node --import tsx -e
          "const {validateReleaseTag}=require('./scripts/github-release-artifacts.ts');
          const fs=require('node:fs');
          validateReleaseTag(process.env.RELEASE_TAG,JSON.parse(fs.readFileSync('extension/dist/manifest.json','utf8')).version)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-extension-${{ github.sha }}
          path: |
            extension/dist-package/talvyn-extension.zip
            extension/dist-package/talvyn-extension.zip.sha256
            extension/dist-package/RELEASE-NOTES.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: validate
    # The owner must configure the protected environment and explicitly enable publication.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.TALVYN_RELEASES_ENABLED == 'true'
    environment: extension-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      TALVYN_EXTENSION_PUBLIC_KEY: ${{ vars.TALVYN_EXTENSION_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-extension-${{ github.sha }}
          path: extension/dist-package
      - name: Validate approved identity, tag and exact artifact before any GitHub write
        run: npm run prepare:github-release -- --tag "$RELEASE_TAG"
      - name: Create and publish the approved version with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'A release already exists for this tag. Refusing to overwrite assets or publication metadata.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            extension/dist-package/talvyn-extension.zip \
            extension/dist-package/talvyn-extension.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Talvyn extension $RELEASE_TAG" \
            --notes-file extension/dist-package/RELEASE-NOTES.md
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/talvyn-release-info.json"
          npm run prepare:github-release -- --tag "$RELEASE_TAG" --release-info "$RUNNER_TEMP/talvyn-release-info.json"
          gh release upload "$RELEASE_TAG" extension/dist-package/extension-release.json --repo "$GITHUB_REPOSITORY"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern talvyn-extension.zip --pattern extension-release.json \
            --dir "$RUNNER_TEMP/talvyn-published"
          node -e 'const fs=require("node:fs"),path=require("node:path"); for(const name of ["talvyn-extension.zip","extension-release.json"]) { if(!fs.readFileSync(path.join("extension/dist-package",name)).equals(fs.readFileSync(path.join(process.env.RUNNER_TEMP,"talvyn-published",name)))) throw new Error("Published asset bytes differ: "+name) }'
      # GitHub release immutability must be OFF: metadata is attached only after the actual published_at exists.
      # A failure may leave a draft or a published release without metadata; inspect it manually, never overwrite silently.
